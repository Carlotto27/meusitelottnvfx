<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Lazy Video Teste</title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: sans-serif;
      padding: 2rem;
    }

    .floating {
      border-radius: 16px;
      overflow: hidden;
      max-width: 100%;
      width: 480px;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <h2>Teste de Lazy Load em Vídeo</h2>

  <video class="floating" controls loop poster="videos/Casa01.webp">
    <source data-src="videos/teste.mp4" type="video/mp4" />
    Seu navegador não suporta vídeos HTML5.
  </video>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const videos = document.querySelectorAll("video");

      videos.forEach((video) => {
        const source = video.querySelector("source");

        const loadVideo = () => {
          if (!source || source.src) return;

          const src = source.getAttribute("data-src");
          if (src) {
            source.setAttribute("src", src);
            video.load();
            video.play();
          }
        };

        video.addEventListener("play", loadVideo, { once: true });

        // controle de pausa entre vídeos
        video.addEventListener("play", () => {
          videos.forEach((otherVideo) => {
            if (otherVideo !== video) otherVideo.pause();
          });
        });
      });
    });
  </script>

</body>
</html>
