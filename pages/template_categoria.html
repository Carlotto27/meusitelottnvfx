<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{CATEGORY_NAME}}</title>
  <link rel="stylesheet" href="../assets/css/projects.css" />
  <link rel="icon" href="../assets/images/logolottin.webp" type="image/png" />
  <link rel="shortcut icon" href="../assets/images/logolottin.webp" type="image/png" />
</head>
<body>
  <button onclick="history.back()" class="voltar-seta">‹</button>

  <!-- Banner -->
  <header class="banner">
    <!-- Desktop -->
    <img src="../{{BG_DESKTOP}}" alt="Fundo Desktop" class="banner-bg desktop-bg" />
    <!-- Mobile -->
    <img src="../{{BG_MOBILE}}" alt="Fundo Mobile" class="banner-bg mobile-bg" />
    <div class="overlay"></div>
    <a href="../index.html" class="logo-banner-link">
      <img src="../assets/images/logolottin01.webp" alt="Lottin Films" class="logo-banner" />
    </a>
    <div class="banner-content">
      <h2>{{CATEGORY_NAME}}</h2>
      <p>{{CATEGORY_DESC}}</p>
    </div>
  </header>

  <!-- Cards -->
  <section class="projects-section">
    <div class="cards2">
      <!-- O script.js carrega automaticamente os projetos com base no nome do arquivo HTML -->
    </div>
  </section>

  <div class="butao-final-wrapper">
    <button onclick="history.back()" class="butao-final">← Voltar</button>
  </div>

  <script>
    // Scroll suave com Lenis
    const lenisScript = document.createElement("script");
    lenisScript.src = "https://unpkg.com/lenis@1.1.14/dist/lenis.min.js";
    lenisScript.onload = () => {
      const lenis = new Lenis({
        smooth: true,
        duration: 0.7,
        easing: (t) => 1 - Math.pow(1 - t, 4),
      });

      function raf(time) {
        lenis.raf(time);
        requestAnimationFrame(raf);
      }

      requestAnimationFrame(raf);
    };
    document.body.appendChild(lenisScript);
  </script>

  <script>
    // Lazy loading
    const lazyVideos = document.querySelectorAll("video.lazy-video");

    const videoObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const video = entry.target;
          const source = video.querySelector("source");
          if (source && !source.src) {
            source.src = source.dataset.src;
            video.load();
            video.play().catch(e => console.log(e));
          }
          observer.unobserve(video);
        }
      });
    }, {
      threshold: 0.4
    });

    lazyVideos.forEach(video => videoObserver.observe(video));
  </script>

  <script src="../assets/js/script.js"></script>
</body>
</html>
